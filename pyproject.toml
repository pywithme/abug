[project]
name = "abug"
version = "0.1.0"
description = "A playful bug that greets you when you import it 🐛"
readme = "README.md"
license = "MIT"
authors = [
    { name = "pythonic", email = "pythonic@111.com" }
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/pywithme/abug"
Repository = "https://github.com/pywithme/abug"
Issues = "https://github.com/pywithme/abug/issues"
Changelog = "https://github.com/pywithme/abug/releases"

[project.scripts]
abug = "abug.__main__:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
